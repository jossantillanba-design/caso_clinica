<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Salud HTML</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="formulario" class="bg-light">
  <main class="container py-4">
    <h1>Salud Centro</h1>
    <p>Esto es una simulación de un centro de salud</p>
    <form id="centro" class="card p-3" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombres</label>
          <input id="nombre" name="nombre" class="form-control" required minlength="3" maxlength="70">
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Correo</label>
          <input id="email" name="correo" type="email" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label for="especialidad" class="form-label">Especialidad</label>
          <select id="especialidad" name="especialidad" class="form-select" required>
            <option value="">Selecciona</option>
            <option value="Consulta General">Consulta General</option>
            <option value="Odontología">Odontología</option>
            <option value="Nutrición">Nutrición</option>
          </select>
          </div>
        <div class="col-md-4">
          <label for="fecha" class="form-label">Fecha</label>
          <input id="fecha" name="fecha" type="date" class="form-control" required>
          </div>
        <div class="col-md-4">
          <label for="horario" class="form-label">Horario</label>
          <select id="horario" name="horario" class="form-select" required>
          </select>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Confirmar</button>
        <button type="button" class="btn btn-secondary" id="btnLimpiar">Limpiar</button>
      </div>
    </form>
    <p id="mensaje" role="status" class="mt-3"></p>
  </main>
</body>
</html>
