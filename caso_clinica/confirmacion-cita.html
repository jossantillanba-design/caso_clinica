<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación de cita médica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="confirmar">
  <main class="container py-4">
    <div id="sinDatos" class="alert alert-warning text-center d-none" role="alert">
      <h1>Resumen de cita</h1>
      <p class="mb-3">Por favor, ingrese sus datos</p>
      <div class="d-flex justify-content-center">
        <a href="index.html" class="btn btn-secondary">Ir a formulario</a>
      </div>
    </div>

    <div id="conDatos">
      <h1>Resumen de cita</h1>
      <pre id="detalle" class="text-wrap bg-light p-3 border rounded font-monospace fs-6 mb-3"></pre>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-secondary">Editar</a>
        <button id="confirmar" class="btn btn-success">Confirmar</button>
      </div>
    </div>
  </main>
</body>
</html>
